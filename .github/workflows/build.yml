name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: windows-x86-gl-debug, arch: x86 }
          - { preset: windows-x86-gl-release, arch: x86 }
          - { preset: windows-x64-gl-debug, arch: x64 }
          - { preset: windows-x64-gl-release, arch: x64 }
          - { preset: soft-release, arch: x86 }
          - { preset: menu-release, arch: x86 }

    steps:
    - uses: actions/checkout@v4

    - name: Activate MSVC target environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    # Hosted CI has no user-owned HUNTDAT. Run only asset-free tests here;
    # hunt/sound/shutdown validation remains a separate local smoke test.
    - name: Unit and serialized layout tests
      run: ctest --test-dir build/${{ matrix.preset }} -R "^Carnivores2Tests" --output-on-failure

  linux-portability-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
    - uses: actions/checkout@v4
    - name: Configure portable shared tests
      run: cmake --preset linux-portability-tests -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
    - name: Build portable shared tests
      run: cmake --build --preset linux-portability-tests
    - name: Run portable shared tests
      run: ctest --preset linux-portability-tests
