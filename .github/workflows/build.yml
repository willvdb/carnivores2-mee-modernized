name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: windows-x86-gl-debug, arch: x86 }
          - { preset: windows-x86-gl-release, arch: x86 }
          - { preset: windows-x64-gl-debug, arch: x64 }
          - { preset: windows-x64-gl-release, arch: x64 }
          - { preset: windows-x86-sdl-gl-debug, arch: x86 }
          - { preset: windows-x86-sdl-gl-release, arch: x86 }
          - { preset: windows-x64-sdl-gl-debug, arch: x64 }
          - { preset: windows-x64-sdl-gl-release, arch: x64 }
          - { preset: soft-release, arch: x86 }
          - { preset: menu-release, arch: x86 }

    steps:
    - uses: actions/checkout@v4

    - name: Activate MSVC target environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    # Hosted CI has no user-owned HUNTDAT. Run only asset-free tests here;
    # hunt/sound/shutdown validation remains a separate local smoke test.
    - name: Unit and serialized layout tests
      run: ctest --test-dir build/${{ matrix.preset }} -R "^Carnivores2Tests" --output-on-failure

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-x64-sdl-gl-debug, linux-x64-sdl-gl-release]
    steps:
    - uses: actions/checkout@v4

    - name: Install native build and font dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config libfreetype6-dev libfontconfig1-dev fonts-liberation \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdecor-0-dev \
          xserver-xorg-video-dummy x11-xserver-utils x11-utils openbox weston

    # Build the real GL executable against the same pinned SDL as Windows.
    # Synthetic assets cover the loaders; no proprietary HUNTDAT is downloaded.
    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build native game and tests
      run: cmake --build --preset ${{ matrix.preset }} --parallel 2

    - name: Unit and serialized layout tests
      run: ctest --preset ${{ matrix.preset }}

    - name: SDL X11 fullscreen allocation and desktop restoration regression
      run: bash tests/x11/run_mode_leak_test.sh build/${{ matrix.preset }}/Carnivores2SDLX11ModeLeakTest
    - name: Wayland production presentation regression
      if: runner.os == 'Linux'
      run: bash tests/wayland/run_presentation_test.sh build/${{ matrix.preset }}/Carnivores2SDLWaylandPresentationTest build/${{ matrix.preset }}/Carnivores2SDLWaylandDisconnectTest
